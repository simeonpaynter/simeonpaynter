
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simeon | Schedule</title>
    
    <!-- Modular Layout Architecture Imports -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

    <!-- Header Block -->
    <header class="site-header">
        <h1>Calendar</h1>
        <button class="toggle-btn" id="themeToggle" aria-label="Toggle light and dark mode">🌓</button>
    </header>

    <!-- Calendar Layout Block -->
    <main class="site-main site-main--wide">
        <div class="calendar-container">

            <!-- Laptop/Desktop View: Side-by-Side Frames -->
            <div class="calendar-desktop-view">
                <div class="card-box">
                    <iframe src="https://google.com" 
                            height="600" 
                            class="embedded-frame" 
                            scrolling="no">
                    </iframe>
                    
                </div>
                <div class="card-box">
                    <iframe src="https://calendar.google.com/calendar/embed?height=800&wkst=1&ctz=America%2FChicago&showPrint=0&mode=WEEK&src=NGRkNTVlOWJmYmE1YTgzOGI5YzZlZTYwOGI3NjVlZGVlMmZmOGYzYTE4MDNmZTRjYjBjMGQxNmUzOTY4OTM2OUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23ad1457" style="border-width:0" width="1000" height="800" frameborder="0" scrolling="no"></iframe>
                </div>
            </div>

            <!-- Mobile View: Action Button + Single Simplified View -->
            <div class="calendar-mobile-view">
                <a href="https://calendar.app.google/oi6HirGpjjh8Tuos7" target="_blank" class="booking-action-btn">
                    Book a google calendar day
                </a>
                <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FChicago&showPrint=0&mode=AGENDA&src=NGRkNTVlOWJmYmE1YTgzOGI5YzZlZTYwOGI3NjVlZGVlMmZmOGYzYTE4MDNmZTRjYjBjMGQxNmUzOTY4OTM2OUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23ad1457" style="border-width:0" width="400" height="600" frameborder="0" scrolling="no"></iframe>
            </div>

        </div>
    </main>

    <!-- Minimal Inline Footer Navigation Block -->
    <footer class="site-footer">
        <a href="index.html" class="footer-link">Home</a>
        <a href="footer/resume.html" class="footer-link">Resume</a>
        <a href="footer/contact.html" class="footer-link">Contact</a>
        <a href="https://simbo.tech" class="footer-link">Simbo.Tech</a>
    </footer>

    <!-- Native JavaScript Theme Switcher Logical Engine -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
